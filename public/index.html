    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap');

    :root {
      color-scheme: light dark;
      --bg: #f0f2f5;
      --card: #ffffff;
      --primary: #0d6efd;
      --primary-hover: #0b5ed7;
      --text: #1a1d21;
      --label: #555;
      --muted: #6c757d;
      --border: #dee2e6;
      --input-bg: #f8f9fa;
      --success: #28a745;
      --error: #dc3545;
      --warn: #f0a52a;
      --disabled-bg: #e9ecef;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
      --radius: 12px;
    }
    [data-theme="dark"] {
      --bg: #0b0f17;
      --card: #131a26;
      --primary: #4d96ff;
      --primary-hover: #6aa6ff;
      --text: #e6edf3;
      --label: #b6c0cc;
      --muted: #8a95a3;
      --border: #2a3445;
      --input-bg: #0f1623;
      --success: #3ddc84;
      --error: #ff6b6b;
      --warn: #ffb547;
      --disabled-bg: #1a2230;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Noto Sans SC', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      transition: background-color .25s ease, color .25s ease;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 2rem 1.75rem;
      transition: background-color .25s ease;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }
    h1 {
      color: var(--primary);
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
    }
    .icon-btn {
      width: 2.25rem;
      height: 2.25rem;
      padding: 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color .15s, border-color .15s, transform .1s;
    }
    .icon-btn:hover { border-color: var(--primary); }
    .icon-btn:active { transform: scale(.95); }
    .icon-btn svg { width: 1.1rem; height: 1.1rem; }
    [data-theme="dark"] .sun, [data-theme="light"] .moon { display: none; }
    [data-theme="dark"] .moon, [data-theme="light"] .sun { display: block; }

    label { font-weight: 500; color: var(--label); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: .9rem; margin-bottom: .9rem; }
    .row-stack { display: flex; flex-direction: column; gap: .75rem; margin-bottom: 1.5rem; }
    .section { margin-bottom: 1.5rem; }
    .section:last-child { margin-bottom: 0; }

    /* length slider */
    .length-row { gap: 1rem; }
    .length-row input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
      height: 4px;
    }
    #length-input {
      width: 64px;
      padding: .45rem .5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
    }
    #length-input:focus, input[type="number"]:focus, .field:focus {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
      border-color: var(--primary);
    }

    /* checkbox grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .65rem .75rem;
      margin-bottom: 1.5rem;
    }
    .check {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem .65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      cursor: pointer;
      transition: border-color .15s, background-color .15s;
      user-select: none;
    }
    .check:hover { border-color: var(--primary); }
    .check input[type="checkbox"] {
      width: 1.05em;
      height: 1.05em;
      accent-color: var(--primary);
      margin: 0;
    }
    .check span { font-size: .92rem; color: var(--label); }

    /* primary button */
    .btn {
      padding: .7rem 1rem;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color .15s, transform .1s, border-color .15s;
      white-space: nowrap;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled {
      background: var(--disabled-bg);
      color: var(--muted);
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--input-bg);
      color: var(--primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--primary); }
    .btn:active { transform: scale(.98); }

    /* output rows */
    .out-row {
      display: flex;
      gap: .6rem;
      margin-top: 1rem;
    }
    .field {
      flex: 1;
      min-width: 0;
      padding: .7rem .75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .98rem;
      font-weight: 500;
      overflow-x: auto;
      white-space: nowrap;
    }
    .field::placeholder { color: var(--muted); font-family: 'Noto Sans SC', sans-serif; }
    .field[type="password"] { letter-spacing: 0.18em; }

    /* strength bar */
    .strength {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-top: .85rem;
      height: 1.1rem;
      font-size: .8rem;
      color: var(--muted);
    }
    .bar {
      flex: 1;
      height: 6px;
      background: var(--disabled-bg);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--error);
      border-radius: 3px;
      transition: width .25s ease, background-color .25s ease;
    }
    .strength.weak    .bar > i { background: var(--error); }
    .strength.fair    .bar > i { background: var(--warn); }
    .strength.good    .bar > i { background: #4dabf7; }
    .strength.strong  .bar > i { background: var(--success); }
    .strength-label { min-width: 5.5em; text-align: right; }

    /* feedback */
    .feedback {
      text-align: center;
      font-weight: 500;
      height: 1.2em;
      margin-top: .85rem;
      transition: opacity .25s;
      opacity: 0;
      font-size: .9rem;
    }
    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--error); }

    /* section divider */
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0 1.5rem;
    }
    .section-title {
      font-size: .82rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 .25rem;
    }
    .token-section { margin-bottom: 1.5rem; }
    .token-section .section-title { margin-bottom: 0; }

    /* size selector pills */
    .pills {
      display: inline-flex;
      gap: .25rem;
      padding: .2rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .pills button {
      border: none;
      background: transparent;
      color: var(--label);
      padding: .3rem .6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 500;
      font-family: inherit;
      transition: background-color .15s, color .15s;
    }
    .pills button.active {
      background: var(--primary);
      color: white;
    }

    footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.6;
    }
    footer a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px dashed var(--border);
    }
    footer a:hover { color: var(--primary); border-bottom-color: var(--primary); }

    @media (max-width: 480px) {
      body { padding: .75rem; }
      .container { padding: 1.5rem 1.25rem; }
      h1 { font-size: 1.2rem; }
      .grid { grid-template-columns: 1fr; gap: .55rem; }
      .out-row { flex-wrap: wrap; }
      .out-row .field { flex-basis: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <script>
    (function () {
      'use strict';

      // ---- character pools ----
      const POOLS = {
        lower:  'abcdefghijklmnopqrstuvwxyz',
        upper:  'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        digit:  '0123456789',
        symbol: '!@#$%^&*()_+-=[]{}|;:,.<>/?'
      };
      // Characters to drop when "exclude ambiguous" is on.
      const AMBIGUOUS = new Set('0OoIl1`|');

      const $ = (id) => document.getElementById(id);
      const lengthInput = $('length-input');
      const lengthRange = $('length-range');
      const cbs = {
        lower:  $('opt-lower'),
        upper:  $('opt-upper'),
        digit:  $('opt-digit'),
        symbol: $('opt-symbol')
      };
      const cbExclude   = $('opt-exclude');
      const generateBtn = $('generate-btn');
      const resultOut   = $('result-output');
      const copyBtn     = $('copy-btn');
      const visBtn      = $('toggle-visibility');
      const eyeOn       = $('eye-on');
      const eyeOff      = $('eye-off');
      const strengthEl  = $('strength');
      const strengthLabel = strengthEl.querySelector('.strength-label');
      const strengthFill  = strengthEl.querySelector('.bar > i');
      const feedback    = $('feedback-msg');
      const tokenBtn    = $('generate-token-btn');
      const tokenOut    = $('token-output');
      const copyTokenBtn= $('copy-token-btn');
      const uuidBtn     = $('generate-uuid-btn');
      const uuidOut     = $('uuid-output');
      const copyUuidBtn = $('copy-uuid-btn');
      const themeToggle = $('theme-toggle');

      // ---- theme ----
      const THEME_KEY = 'pa.theme';
      function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
      }
      function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'light' || saved === 'dark') { applyTheme(saved); return; }
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(prefersDark ? 'dark' : 'light');
      }
      themeToggle.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem(THEME_KEY, next);
      });
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem(THEME_KEY)) applyTheme(e.matches ? 'dark' : 'light');
      });
      initTheme();

      // ---- crypto helpers ----
      // Unbiased uniform integer in [0, max) via rejection sampling.
      function randInt(max) {
        if (max <= 0) return 0;
        const limit = Math.floor(0x100000000 / max) * max;
        const buf = new Uint32Array(1);
        let n;
        do { crypto.getRandomValues(buf); n = buf[0]; } while (n >= limit);
        return n % max;
      }
      const pick = (str) => str.charAt(randInt(str.length));
      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = randInt(i + 1);
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // ---- length input syncing ----
      function clampLen(v) {
        const n = parseInt(v, 10);
        if (!Number.isFinite(n)) return null;
        return Math.max(3, Math.min(64, n));
      }
      lengthInput.addEventListener('input', () => {
        const n = clampLen(lengthInput.value);
        if (n != null) lengthRange.value = String(n);
        validate();
      });
      lengthInput.addEventListener('blur', () => {
        const n = clampLen(lengthInput.value);
        if (n != null) {
          lengthInput.value = String(n);
          lengthRange.value = String(n);
          validate();
        }
      });
      lengthRange.addEventListener('input', () => {
        lengthInput.value = lengthRange.value;
        validate();
      });

      // ---- selection ----
      function selectedKeys() {
        return Object.keys(cbs).filter(k => cbs[k].checked);
      }
      function buildPool() {
        const keys = selectedKeys();
        const exclude = cbExclude.checked;
        const result = {};
        let pool = '';
        for (const k of keys) {
          let chars = POOLS[k];
          if (exclude) chars = [...chars].filter(c => !AMBIGUOUS.has(c)).join('');
          if (chars.length > 0) {
            result[k] = chars;
            pool += chars;
          }
        }
        return { pool, perType: result, keys: Object.keys(result) };
      }

      function validate() {
        const len = clampLen(lengthInput.value);
        const lenOK = len !== null && len >= 3 && len <= 64;
        lengthInput.style.borderColor = (lengthInput.value && !lenOK) ? 'var(--error)' : 'var(--border)';
        const { keys } = buildPool();
        const enough = keys.length >= 2;
        generateBtn.disabled = !lenOK || !enough;
        return lenOK && enough;
      }

      // ---- generators ----
      function generatePassword() {
        clearFeedback();
        if (!validate()) return;
        const len = clampLen(lengthInput.value);
        const { pool, perType, keys } = buildPool();
        const chars = keys.map(k => pick(perType[k])); // guarantee one of each
        while (chars.length < len) chars.push(pick(pool));
        const pwd = shuffle(chars).join('').slice(0, len);
        resultOut.value = pwd;
        updateStrength(pwd, pool.length);
      }

      function generateToken() {
        const bytes = new Uint8Array(activeBytes);
        crypto.getRandomValues(bytes);
        tokenOut.value = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
        clearFeedback();
      }

      function generateUuid() {
        if (typeof crypto.randomUUID === 'function') {
          uuidOut.value = crypto.randomUUID();
        } else {
          const b = new Uint8Array(16);
          crypto.getRandomValues(b);
          b[6] = (b[6] & 0x0f) | 0x40;
          b[8] = (b[8] & 0x3f) | 0x80;
          const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
          uuidOut.value = `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
        }
        clearFeedback();
      }

      // ---- strength meter (Shannon entropy in bits = length * log2(poolSize)) ----
      function updateStrength(pwd, poolSize) {
        if (!pwd || poolSize <= 1) {
          strengthEl.className = 'strength weak';
          strengthLabel.textContent = '—';
          strengthFill.style.width = '0%';
          return;
        }
        const bits = pwd.length * Math.log2(poolSize);
        // Buckets: <40 weak, <60 fair, <80 good, ≥80 strong.
        let level, label, pct;
        if (bits < 40)      { level = 'weak';   label = '弱';     pct = Math.max(8, bits / 40 * 25); }
        else if (bits < 60) { level = 'fair';   label = '一般';   pct = 25 + (bits - 40) / 20 * 25; }
        else if (bits < 80) { level = 'good';   label = '强';     pct = 50 + (bits - 60) / 20 * 25; }
        else                { level = 'strong'; label = '非常强'; pct = Math.min(100, 75 + (bits - 80) / 40 * 25); }
        strengthEl.className = 'strength ' + level;
        strengthLabel.textContent = `${label} · ${Math.round(bits)} bit`;
        strengthFill.style.width = pct + '%';
      }

      // ---- show / hide ----
      visBtn.addEventListener('click', () => {
        const isPwd = resultOut.type === 'password';
        resultOut.type = isPwd ? 'text' : 'password';
        eyeOn.style.display  = isPwd ? 'none'  : 'block';
        eyeOff.style.display = isPwd ? 'block' : 'none';
      });

      // ---- copy ----
      let feedbackTimer = null;
      function showFeedback(msg, type) {
        feedback.textContent = msg;
        feedback.className = 'feedback ' + (type || 'success');
        feedback.style.opacity = '1';
        clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => { feedback.style.opacity = '0'; }, 1800);
      }
      function clearFeedback() {
        feedback.textContent = '';
        feedback.style.opacity = '0';
      }
      async function copyValue(el, label) {
        const v = el.value;
        if (!v) return;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(v);
          } else {
            const wasPwd = el.type === 'password';
            if (wasPwd) el.type = 'text';
            el.select();
            document.execCommand('copy');
            if (wasPwd) el.type = 'password';
            window.getSelection().removeAllRanges();
          }
          showFeedback(label + ' 已复制到剪贴板!', 'success');
        } catch (err) {
          console.error('Copy failed', err);
          showFeedback('复制失败，请手动复制', 'error');
        }
      }

      // ---- token byte size pills ----
      let activeBytes = 32;
      const pillBtns = document.querySelectorAll('.pills [data-bytes]');
      pillBtns.forEach(b => b.addEventListener('click', () => {
        pillBtns.forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        activeBytes = parseInt(b.dataset.bytes, 10);
      }));

      // ---- wire-up ----
      Object.values(cbs).forEach(cb => cb.addEventListener('change', () => {
        validate();
        if (resultOut.value) generatePassword();
      }));
      cbExclude.addEventListener('change', () => {
        validate();
        if (resultOut.value) generatePassword();
      });
      generateBtn.addEventListener('click', generatePassword);
      copyBtn.addEventListener('click',     () => copyValue(resultOut, '密码'));
      tokenBtn.addEventListener('click',    generateToken);
      copyTokenBtn.addEventListener('click', () => copyValue(tokenOut, 'Token'));
      uuidBtn.addEventListener('click',     generateUuid);
      copyUuidBtn.addEventListener('click', () => copyValue(uuidOut, 'UUID'));

      // Keyboard shortcuts: Enter regenerates the password unless focus is in an output field.
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const t = e.target;
        if (t && (t.id === 'token-output' || t.id === 'uuid-output' || t.id === 'result-output')) return;
        if (!generateBtn.disabled) {
          e.preventDefault();
          generatePassword();
        }
      });

      // First load: populate everything.
      validate();
      generatePassword();
      generateToken();
      generateUuid();
    })();
  </script>
</body>
</html>
